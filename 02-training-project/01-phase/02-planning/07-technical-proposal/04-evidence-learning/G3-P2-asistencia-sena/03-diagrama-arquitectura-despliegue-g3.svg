<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 810" width="1600" height="810" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrEnd" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#1e293b"/>
    </marker>
    <marker id="arrStart" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M11,1 L2,6 L11,11 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="1600" height="810" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">B3 · Arquitectura de Despliegue en Producción (7 Nodos Trazables al Presupuesto B2) — asistencia-sena</text>
  <text x="30" y="55" font-size="12" fill="#475569">Evolución desde G2-P1/A6 (4 nodos locales) incorporando borde TLS [N3], respaldos cifrados externos [N6] y monitoreo ANS [N7].</text>

  <!-- N1 Cliente Escritorio -->
  <g>
    <polygon points="30,105 46,89 326,89 310,105" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.6"/>
    <polygon points="310,105 326,89 326,259 310,275" fill="#93c5fd" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="30" y="105" width="280" height="170" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="170" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">[N1] «device · Instructor / Coordinador»</text>
    <text x="170" y="147" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Cliente Escritorio</text>
    <line x1="44" y1="157" x2="296" y2="157" stroke="#bfdbfe"/>
    <text x="44" y="177" font-size="11" fill="#1e293b">• Navegador Chrome / Edge actual</text>
    <text x="44" y="195" font-size="11" fill="#1e293b">• WebAppInstructor + BarcodeDetector</text>
    <text x="44" y="213" font-size="11" fill="#1e293b">• Sin instalación de cliente pesado</text>
    <text x="44" y="247" font-size="10.5" font-style="italic" fill="#1d4ed8">B2: Excluido (estación existente cliente)</text>
  </g>

  <!-- N2 Cliente Móvil -->
  <g>
    <polygon points="30,345 46,329 326,329 310,345" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.6"/>
    <polygon points="310,345 326,329 326,499 310,515" fill="#86efac" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="30" y="345" width="280" height="170" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
    <text x="170" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">[N2] «device · Aprendiz BYOD»</text>
    <text x="170" y="387" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Cliente Móvil (≥ 390 px)</text>
    <line x1="44" y1="397" x2="296" y2="397" stroke="#bbf7d0"/>
    <text x="44" y="417" font-size="11" fill="#1e293b">• Navegador Android / iOS estándar</text>
    <text x="44" y="435" font-size="11" fill="#1e293b">• WebAppMovilAprendiz + Geolocation</text>
    <text x="44" y="453" font-size="11" fill="#1e293b">• Consentimiento Ley 1581 + Código 6d</text>
    <text x="44" y="487" font-size="10.5" font-style="italic" fill="#15803d">B2: Excluido (móvil propio + contingencia)</text>
  </g>

  <!-- N3 Proxy Inverso TLS + DNS -->
  <g>
    <polygon points="435,210 451,194 726,194 710,210" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="710,210 726,194 726,394 710,410" fill="#fcd34d" stroke="#d97706" stroke-width="1.8"/>
    <rect x="435" y="210" width="275" height="200" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="572" y="233" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">[N3] «edge · Dominio y Proxy TLS»</text>
    <text x="572" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Borde DNS + Nginx / Caddy</text>
    <line x1="450" y1="262" x2="696" y2="262" stroke="#fde68a"/>
    <text x="450" y="284" font-size="11" fill="#1e293b">• Dominio institucional (.co/.com)</text>
    <text x="450" y="303" font-size="11" fill="#1e293b">• Certificado Let's Encrypt (TLS 1.3)</text>
    <text x="450" y="322" font-size="11" fill="#1e293b">• Cabeceras HSTS, X-Frame, nosniff</text>
    <text x="450" y="341" font-size="11" fill="#1e293b">• Terminación HTTPS 443 y rate limit</text>
    <text x="450" y="382" font-size="10.5" font-style="italic" fill="#b45309">B2: Rubro Dominio/DNS y Seguridad</text>
  </g>

  <!-- N4 Servidor Aplicación -->
  <g>
    <polygon points="825,185 843,167 1168,167 1150,185" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <polygon points="1150,185 1168,167 1168,412 1150,430" fill="#fdba74" stroke="#ea580c" stroke-width="2"/>
    <rect x="825" y="185" width="325" height="245" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="987" y="209" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">[N4] «executionEnvironment · VPS Nube»</text>
    <text x="987" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Servidor Aplicación (Docker)</text>
    <line x1="840" y1="240" x2="1135" y2="240" stroke="#fed7aa"/>
    <text x="840" y="262" font-size="11" fill="#1e293b">• Ubuntu 24.04 LTS + Docker Engine CE</text>
    <text x="840" y="282" font-size="11" fill="#1e293b">• Contenedor: sena-asistencias-web</text>
    <text x="840" y="302" font-size="11" fill="#1e293b">• Apache 2.4 + PHP 8.3 (TZ -05:00)</text>
    <text x="840" y="322" font-size="11" fill="#1e293b">• Fachada + Estrategias + PDO + qrcodejs local</text>
    <text x="840" y="342" font-size="11" fill="#1e293b">• Blindaje .htaccess (403 en /docs, *.sql)</text>
    <text x="840" y="395" font-size="10.5" font-style="italic" fill="#9a3412">B2: Rubro Nube/VPS + Desarrollo Software</text>
  </g>

  <!-- N5 Servidor Datos -->
  <g>
    <polygon points="1255,185 1273,167 1578,167 1560,185" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <polygon points="1560,185 1578,167 1578,412 1560,430" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1255" y="185" width="305" height="245" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1407" y="209" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">[N5] «database · Red Privada»</text>
    <text x="1407" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Servidor Datos (MariaDB)</text>
    <line x1="1270" y1="240" x2="1545" y2="240" stroke="#ddd6fe"/>
    <text x="1270" y="262" font-size="11" fill="#1e293b">• Contenedor: sena-asistencias-db</text>
    <text x="1270" y="282" font-size="11" fill="#1e293b">• MariaDB 10.11 InnoDB (utf8mb4)</text>
    <text x="1270" y="302" font-size="11" fill="#1e293b">• 10 tablas 3FN + 11 FK + 22 CHECK</text>
    <text x="1270" y="322" font-size="11" fill="#1e293b">• Volumen SSD sena_db_data</text>
    <text x="1270" y="342" font-size="11" fill="#1e293b">• Puerto TCP 3306 cerrado a Internet</text>
    <text x="1270" y="395" font-size="10.5" font-style="italic" fill="#5b21b6">B2: Rubro Infraestructura / BD</text>
  </g>

  <!-- N6 Respaldos S3 -->
  <g>
    <polygon points="1255,540 1271,524 1576,524 1560,540" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.8"/>
    <polygon points="1560,540 1576,524 1576,684 1560,700" fill="#e9d5ff" stroke="#9333ea" stroke-width="1.8"/>
    <rect x="1255" y="540" width="305" height="160" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
    <text x="1407" y="563" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7e22ce">[N6] «storage · Encargado Datos»</text>
    <text x="1407" y="582" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Respaldos Externos S3</text>
    <line x1="1270" y1="592" x2="1545" y2="592" stroke="#e9d5ff"/>
    <text x="1270" y="612" font-size="11" fill="#1e293b">• mysqldump diario 02:00 a. m.</text>
    <text x="1270" y="630" font-size="11" fill="#1e293b">• Cifrado AES-256 · retención 30 días</text>
    <text x="1270" y="648" font-size="11" fill="#1e293b">• Prueba mensual de restauración</text>
    <text x="1270" y="680" font-size="10.5" font-style="italic" fill="#7e22ce">B2: Respaldos · RPO ≤ 24h / RTO ≤ 2h</text>
  </g>

  <!-- N7 Monitoreo ANS -->
  <g>
    <polygon points="435,540 451,524 726,524 710,540" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
    <polygon points="710,540 726,524 726,684 710,700" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="435" y="540" width="275" height="160" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="572" y="563" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1">[N7] «service · Observabilidad»</text>
    <text x="572" y="582" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Monitoreo y Alertas ANS</text>
    <line x1="450" y1="592" x2="696" y2="592" stroke="#bae6fd"/>
    <text x="450" y="612" font-size="11" fill="#1e293b">• Sondeo HTTPS externo cada 60 s</text>
    <text x="450" y="630" font-size="11" fill="#1e293b">• Reporte mensual disponibilidad</text>
    <text x="450" y="648" font-size="11" fill="#1e293b">• Alertas de caída y latencia p95</text>
    <text x="450" y="680" font-size="10.5" font-style="italic" fill="#0369a1">B2: Operación y Soporte · ANS B6</text>
  </g>

  <!-- Conexiones -->
  <line x1="326" y1="190" x2="435" y2="270" stroke="#1e293b" stroke-width="2" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <rect x="330" y="196" width="102" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="381" y="211" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">HTTPS 443</text>

  <line x1="326" y1="425" x2="435" y2="345" stroke="#1e293b" stroke-width="2" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <rect x="330" y="388" width="102" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="381" y="403" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">HTTPS 443</text>

  <line x1="726" y1="305" x2="825" y2="305" stroke="#1e293b" stroke-width="2" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <rect x="731" y="274" width="90" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="776" y="291" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">HTTP interno</text>

  <line x1="1168" y1="305" x2="1255" y2="305" stroke="#5b21b6" stroke-width="2.2" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <rect x="1171" y="271" width="82" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1212" y="284" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">PDO 3306</text>
  <text x="1212" y="295" text-anchor="middle" font-size="8.5" fill="#5b21b6">Privado</text>

  <line x1="1407" y1="430" x2="1407" y2="524" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrEnd)"/>
  <rect x="1318" y="464" width="178" height="22" rx="4" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="1407" y="479" text-anchor="middle" font-size="10" font-weight="700" fill="#7e22ce">HTTPS / S3 API (TLS 1.3)</text>

  <line x1="572" y1="524" x2="572" y2="410" stroke="#0369a1" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrEnd)"/>
  <rect x="492" y="458" width="160" height="22" rx="4" fill="#ffffff" stroke="#bae6fd"/>
  <text x="572" y="473" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">HTTPS Healthcheck 60s</text>

  <!-- Pie de trazabilidad -->
  <rect x="30" y="730" width="1548" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="48" y="754" font-size="11.5" font-weight="700" fill="#0f172a">Trazabilidad Arquitectura ↔ Presupuesto (B2):</text>
  <text x="335" y="754" font-size="11" fill="#334155">N1 y N2 se declaran excluidos del presupuesto (dispositivos del contratante/aprendiz). N3–N7 tienen rubro explícito en la hoja de presupuesto B2.</text>
  <text x="48" y="774" font-size="11" fill="#334155">Nota de escalabilidad: en variantes con disponibilidad ≥ 99,9 % (Variante D), N4 y N5 se despliegan en redundancia activa (2 nodos) detrás del balanceador N3.</text>
</svg>
