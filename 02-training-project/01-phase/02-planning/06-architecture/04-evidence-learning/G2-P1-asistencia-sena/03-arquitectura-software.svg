  </defs>
  <rect width="1300" height="800" fill="#ffffff"/>
  <text x="35" y="34" font-size="18" font-weight="700" fill="#0f172a">A4 · Arquitectura en 3 Capas Estrictas (Sin Saltos de Capa) — asistencia-sena</text>

  <!-- Capa 1 -->
  <rect x="40" y="60" width="1220" height="175" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
