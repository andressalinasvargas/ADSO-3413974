  <rect x="70" y="108" width="560" height="108" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="350" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Vistas Instructor / Coordinador (Desktop)</text>
  <text x="350" y="152" text-anchor="middle" font-size="11.5" fill="#334155">index.php · dashboard.php · aprendices.php · qr.php · tomar_asistencia.php</text>
  <text x="350" y="170" text-anchor="middle" font-size="11.5" fill="#334155">sesion.php · cerrar_sesion.php · scanner.php · registro_manual.php · asistencias.php</text>
  <text x="350" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#1d4ed8">Cookies HttpOnly · Tokens CSRF · Sanitización XSS e() y escHtml()</text>

  <rect x="670" y="108" width="560" height="108" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="950" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Vistas Móvil Aprendiz (≥ 390 px)</text>
  <text x="950" y="152" text-anchor="middle" font-size="11.5" fill="#334155">codigo.php · registro.php · politica_datos.php</text>
  <text x="950" y="172" text-anchor="middle" font-size="11.5" fill="#334155">Geolocation API HTML5 · Consentimiento expreso Ley 1581 de 2012</text>
  <text x="950" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#1d4ed8">Flujo móvil en ≤ 3 pasos · Sin acceso directo a BD</text>

