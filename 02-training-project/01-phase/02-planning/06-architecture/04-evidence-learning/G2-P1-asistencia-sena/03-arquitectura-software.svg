  <text x="660" y="414" text-anchor="middle" font-size="11.5" fill="#1e293b">IEstrategiaRegistro «GoF Estrategia»</text>
  <text x="660" y="434" text-anchor="middle" font-size="11.5" fill="#334155">(MovilQr / EscanerQr / ManualContingencia)</text>
