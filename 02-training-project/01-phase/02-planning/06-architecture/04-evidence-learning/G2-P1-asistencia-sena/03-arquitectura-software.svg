  <text x="1057" y="396" text-anchor="middle" font-size="11.5" fill="#334155">ValidadorGeocerca (Haversine ≤ 100 m)</text>
  <text x="1057" y="418" text-anchor="middle" font-size="11.5" fill="#334155">CalculadorTardanza</text>
  <text x="1057" y="440" text-anchor="middle" font-size="11.5" fill="#334155">ServicioReportes (Historial y CSV)</text>

  <!-- Capa 3 -->
  <rect x="40" y="555" width="1220" height="190" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="40" y="555" width="1220" height="32" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="58" y="576" font-size="13.5" font-weight="700" fill="#4c1d95">Capa 3 · Acceso a Datos y Persistencia (PDO Nativo · TCP 3306 Red Privada)</text>

  <rect x="70" y="608" width="560" height="112" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="350" y="636" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">IRepositorioAsistencia (PDO Nativo)</text>
  <text x="350" y="660" text-anchor="middle" font-size="11.5" fill="#334155">ATTR_EMULATE_PREPARES = false · Sentencias Preparadas Reales</text>
  <text x="350" y="682" text-anchor="middle" font-size="11.5" fill="#334155">Manejo estricto SQLSTATE 23000 · Transacciones ACID · Singleton por petición</text>

  <rect x="690" y="608" width="540" height="112" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="960" y="636" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MariaDB 10.11 InnoDB (sena_asistencias)</text>
  <text x="960" y="660" text-anchor="middle" font-size="11.5" fill="#334155">10 Tablas Normalizadas (3FN) · UNIQUE (id_aprendiz, id_sesion)</text>
  <text x="960" y="682" text-anchor="middle" font-size="11.5" fill="#334155">Restricciones CHECK y FK ON DELETE · Volumen persistente sena_db_data</text>

