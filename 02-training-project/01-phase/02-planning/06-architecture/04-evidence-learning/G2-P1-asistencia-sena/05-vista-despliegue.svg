<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 720" width="1450" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrEnd" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L10,6 L1,11 Z" fill="#1e293b"/>
    </marker>
    <marker id="arrStart" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M11,1 L2,6 L11,11 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="1450" height="720" fill="#ffffff"/>
  <text x="35" y="34" font-size="18" font-weight="700" fill="#0f172a">A6 · Vista de Despliegue (4 Nodos, Artefactos, Protocolos y Decisiones RNF) — asistencia-sena</text>

  <!-- Nodo 1 -->
  <g>
    <polygon points="45,95 65,75 375,75 355,95" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
    <polygon points="355,95 375,75 375,275 355,295" fill="#93c5fd" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="45" y="95" width="310" height="200" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="200" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">«device · Estación Instructor»</text>
    <text x="200" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Nodo 1: Cliente Escritorio</text>
    <line x1="60" y1="152" x2="340" y2="152" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="60" y="174" font-size="11.5" fill="#1e293b">• Navegador Chrome / Edge</text>
    <text x="60" y="194" font-size="11.5" fill="#1e293b">• Interfaz WebAppInstructor</text>
    <text x="60" y="214" font-size="11.5" fill="#1e293b">• API BarcodeDetector (Escáner QR)</text>
    <text x="60" y="250" font-size="11" font-style="italic" fill="#1d4ed8">RNF-01: TLS habilita cámara y cookies HttpOnly</text>
  </g>

  <!-- Nodo 2 -->
  <g>
    <polygon points="45,390 65,370 375,370 355,390" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
    <polygon points="355,390 375,370 375,570 355,590" fill="#86efac" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="45" y="390" width="310" height="200" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="200" y="415" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">«device · Smartphone Aprendiz»</text>
    <text x="200" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Nodo 2: Cliente Móvil</text>
    <line x1="60" y1="447" x2="340" y2="447" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="60" y="469" font-size="11.5" fill="#1e293b">• Navegador Android / iOS (≥ 390 px)</text>
    <text x="60" y="489" font-size="11.5" fill="#1e293b">• WebAppMovilAprendiz (codigo/registro)</text>
    <text x="60" y="509" font-size="11.5" fill="#1e293b">• Geolocation API + Consentimiento Ley 1581</text>
    <text x="60" y="545" font-size="11" font-style="italic" fill="#15803d">RNF-02, RNF-04: Flujo ≤ 3 pasos sin app nativa</text>
  </g>

  <!-- Nodo 3 -->
  <g>
    <polygon points="540,210 562,188 962,188 940,210" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <polygon points="940,210 962,188 962,458 940,480" fill="#fdba74" stroke="#ea580c" stroke-width="2"/>
    <rect x="540" y="210" width="400" height="270" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">«executionEnvironment · Contenedor Docker»</text>
    <text x="740" y="258" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Nodo 3: sena-asistencias-web</text>
    <line x1="556" y1="270" x2="924" y2="270" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="556" y="294" font-size="11.5" fill="#1e293b">• Apache 2.4 + PHP 8.3 (TZ America/Bogota -05:00)</text>
    <text x="556" y="316" font-size="11.5" fill="#1e293b">• FachadaControlAsistencia + Estrategias + PDO</text>
    <text x="556" y="338" font-size="11.5" fill="#1e293b">• Blindaje .htaccess (HTTP 403 en /docs, /e2e, *.sql)</text>
    <text x="556" y="360" font-size="11.5" fill="#1e293b">• Cabeceras X-Frame-Options SAMEORIGIN y nosniff</text>
    <text x="556" y="382" font-size="11.5" fill="#1e293b">• Healthcheck HTTP (Local dev :8090 / Prod TLS :443)</text>
    <text x="556" y="425" font-size="11" font-style="italic" fill="#9a3412">RNF-01, RNF-03, RNF-05: Aislamiento y alta respuesta</text>
  </g>

  <!-- Nodo 4 -->
  <g>
    <polygon points="1080,210 1102,188 1432,188 1410,210" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <polygon points="1410,210 1432,188 1432,458 1410,480" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1080" y="210" width="330" height="270" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1245" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">«database · Contenedor Docker»</text>
    <text x="1245" y="258" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Nodo 4: sena-asistencias-db</text>
    <line x1="1096" y1="270" x2="1394" y2="270" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="1096" y="294" font-size="11.5" fill="#1e293b">• MariaDB 10.11 InnoDB (utf8mb4)</text>
    <text x="1096" y="316" font-size="11.5" fill="#1e293b">• Esquema sena_asistencias (10 tablas 3FN)</text>
    <text x="1096" y="338" font-size="11.5" fill="#1e293b">• Volumen persistente sena_db_data</text>
    <text x="1096" y="360" font-size="11.5" fill="#1e293b">• Respaldo automático mysqldump</text>
    <text x="1096" y="382" font-size="11.5" fill="#1e293b">• Red privada interna (puerto 3306 cerrado)</text>
    <text x="1096" y="425" font-size="11" font-style="italic" fill="#5b21b6">RNF-01, RNF-06: Cero exposición a Internet</text>
  </g>

  <!-- Conexiones con protocolo y puerto -->
  <line x1="375" y1="200" x2="540" y2="290" stroke="#1e293b" stroke-width="2" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <rect x="388" y="210" width="142" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="459" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">HTTPS · TCP 443 (TLS)</text>

  <line x1="375" y1="485" x2="540" y2="390" stroke="#1e293b" stroke-width="2" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <rect x="388" y="438" width="142" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="459" y="454" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">HTTPS · TCP 443 (TLS)</text>

  <line x1="962" y1="340" x2="1080" y2="340" stroke="#4c1d95" stroke-width="2.2" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <rect x="970" y="302" width="102" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1021" y="317" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">PDO Nativo</text>
  <text x="1021" y="330" text-anchor="middle" font-size="10" fill="#4c1d95">TCP 3306 Privado</text>

  <!-- Pie explicativo -->
  <rect x="45" y="625" width="1387" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="65" y="652" font-size="12" font-weight="700" fill="#0f172a">Nota de operación:</text>
  <text x="195" y="652" font-size="11.5" fill="#334155">En entorno local Docker Compose se publica HTTP 8090 → 80/tcp para pruebas E2E; en producción SENA el acceso externo es exclusivamente HTTPS 443 vía proxy TLS.</text>
  <text x="65" y="674" font-size="11.5" fill="#334155">El puerto TCP 3306 permanece aislado en la red privada bridge entre los contenedores web y db, impidiendo acceso directo desde clientes o Internet.</text>
</svg>
