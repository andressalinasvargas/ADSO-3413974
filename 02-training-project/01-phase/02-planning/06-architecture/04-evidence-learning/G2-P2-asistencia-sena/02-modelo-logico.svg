<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1050" width="1620" height="1050" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="cfZeroMany" viewBox="0 0 24 16" refX="22" refY="8" markerWidth="18" markerHeight="14" orient="auto">
      <circle cx="6" cy="8" r="3.8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
      <path d="M12,8 L22,2 M12,8 L22,8 M12,8 L22,14" fill="none" stroke="#334155" stroke-width="1.6"/>
    </marker>
    <marker id="cfOneMany" viewBox="0 0 22 16" refX="20" refY="8" markerWidth="18" markerHeight="14" orient="auto">
      <line x1="6" y1="2" x2="6" y2="14" stroke="#334155" stroke-width="1.8"/>
      <path d="M10,8 L20,2 M10,8 L20,8 M10,8 L20,14" fill="none" stroke="#334155" stroke-width="1.6"/>
    </marker>
    <marker id="cfMandOne" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <line x1="6" y1="2" x2="6" y2="14" stroke="#334155" stroke-width="1.8"/>
      <line x1="11" y1="2" x2="11" y2="14" stroke="#334155" stroke-width="1.8"/>
    </marker>
    <marker id="cfZeroOne" viewBox="0 0 20 16" refX="2" refY="8" markerWidth="16" markerHeight="14" orient="auto">
      <line x1="6" y1="2" x2="6" y2="14" stroke="#334155" stroke-width="1.8"/>
      <circle cx="13" cy="8" r="3.6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1620" height="1050" fill="#ffffff"/>
  <text x="35" y="34" font-size="18" font-weight="700" fill="#0f172a">B2 · Modelo Lógico Relacional (10 Tablas 3FN · PK/FK y Reglas ON DELETE) — asistencia-sena</text>

  <!-- 1. programa_formacion -->
  <rect x="40" y="70" width="280" height="125" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.8"/>
  <rect x="40" y="70" width="280" height="28" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="180" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">programa_formacion</text>
  <text x="52" y="118" font-size="11" fill="#1e293b">PK id_programa : INT</text>
  <text x="52" y="135" font-size="11" fill="#1e293b">UK codigo_programa : VARCHAR(20)</text>
  <text x="52" y="152" font-size="11" fill="#1e293b">nombre_programa : VARCHAR(150)</text>
  <text x="52" y="169" font-size="11" fill="#1e293b">nivel_formacion : VARCHAR(40)</text>

  <!-- 2. sede -->
  <rect x="40" y="235" width="280" height="135" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.8"/>
  <rect x="40" y="235" width="280" height="28" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="180" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">sede</text>
  <text x="52" y="282" font-size="11" fill="#1e293b">PK id_sede : INT</text>
  <text x="52" y="299" font-size="11" fill="#1e293b">UK nombre_sede : VARCHAR(120)</text>
  <text x="52" y="316" font-size="11" fill="#1e293b">latitud_sede : DECIMAL(10,7)</text>
  <text x="52" y="333" font-size="11" fill="#1e293b">longitud_sede : DECIMAL(10,7)</text>
  <text x="52" y="350" font-size="11" fill="#1e293b">radio_max_metros : INT</text>

  <!-- 3. ficha -->
  <rect x="455" y="140" width="295" height="145" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="455" y="140" width="295" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="602" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ficha</text>
  <text x="467" y="188" font-size="11" fill="#1e293b">PK id_ficha : INT</text>
  <text x="467" y="205" font-size="11" fill="#1e293b">UK numero_ficha : VARCHAR(30)</text>
  <text x="467" y="222" font-size="11" fill="#1e293b">jornada : VARCHAR(30) / activa : TINYINT(1)</text>
  <text x="467" y="239" font-size="11" fill="#1d4ed8">FK id_programa : INT (ON DELETE RESTRICT)</text>
  <text x="467" y="256" font-size="11" fill="#1d4ed8">FK id_sede : INT (ON DELETE RESTRICT)</text>

  <!-- 4. usuario_sistema -->
  <rect x="1095" y="70" width="405" height="165" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="1095" y="70" width="405" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="1297" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">usuario_sistema</text>
  <text x="1107" y="118" font-size="11" fill="#1e293b">PK id_usuario : INT / UK documento : VARCHAR(30)</text>
  <text x="1107" y="135" font-size="11" fill="#1e293b">nombre : VARCHAR(120) / UK email : VARCHAR(120)</text>
  <text x="1107" y="152" font-size="11" fill="#1e293b">UK usuario : VARCHAR(60)</text>
  <text x="1107" y="169" font-size="11" font-weight="600" fill="#991b1b">password_hash : VARCHAR(255) (BCrypt/Argon2id)</text>
  <text x="1107" y="186" font-size="11" fill="#1e293b">rol_sistema : VARCHAR(30) / especialidad : VARCHAR(120)</text>
  <text x="1107" y="203" font-size="11" fill="#1e293b">activo : TINYINT(1) / creado_en : DATETIME</text>

  <!-- 5. asignacion_instructor_ficha -->
  <rect x="850" y="295" width="335" height="130" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="850" y="295" width="335" height="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="1017" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">asignacion_instructor_ficha</text>
  <text x="862" y="344" font-size="11" fill="#5b21b6">PK,FK id_usuario : INT (ON DELETE RESTRICT)</text>
  <text x="862" y="362" font-size="11" fill="#5b21b6">PK,FK id_ficha : INT (ON DELETE RESTRICT)</text>
  <text x="862" y="380" font-size="11" fill="#1e293b">PK fecha_inicio : DATE / fecha_fin : DATE</text>
  <text x="862" y="398" font-size="11" fill="#1e293b">rol_en_ficha : VARCHAR(40)</text>

  <!-- 6. aprendiz -->
  <rect x="40" y="455" width="335" height="150" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="40" y="455" width="335" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="207" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">aprendiz</text>
  <text x="52" y="502" font-size="11" fill="#1e293b">PK id_aprendiz : INT / UK documento : VARCHAR(30)</text>
  <text x="52" y="519" font-size="11" fill="#1e293b">nombre : VARCHAR(150) / email : VARCHAR(120)</text>
  <text x="52" y="536" font-size="11" fill="#1e293b">UK qr_token : VARCHAR(64) / activo : TINYINT(1)</text>
  <text x="52" y="553" font-size="11" fill="#15803d">FK id_ficha : INT NULL (ON DELETE SET NULL)</text>
  <text x="52" y="570" font-size="11" fill="#1e293b">creado_en : DATETIME</text>

  <!-- 7. telefono_aprendiz -->
  <rect x="40" y="680" width="335" height="130" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="40" y="680" width="335" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="207" y="699" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">telefono_aprendiz</text>
  <text x="52" y="728" font-size="11" fill="#1e293b">PK id_telefono : INT</text>
  <text x="52" y="746" font-size="11" fill="#15803d">FK id_aprendiz : INT (ON DELETE CASCADE)</text>
  <text x="52" y="764" font-size="11" fill="#1e293b">numero_telefono : VARCHAR(20) (UK por aprendiz)</text>
  <text x="52" y="782" font-size="11" fill="#1e293b">tipo_telefono : VARCHAR(20)</text>

  <!-- 8. sesion_asistencia -->
  <rect x="455" y="470" width="405" height="155" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="455" y="470" width="405" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="657" y="489" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">sesion_asistencia</text>
  <text x="467" y="518" font-size="11" fill="#1e293b">PK id_sesion : INT / UK token : VARCHAR(64) / UK codigo : VARCHAR(8)</text>
  <text x="467" y="535" font-size="11" fill="#1d4ed8">FK id_ficha : INT NULL (ON DELETE SET NULL)</text>
  <text x="467" y="552" font-size="11" fill="#1d4ed8">FK id_usuario : INT (ON DELETE RESTRICT)</text>
  <text x="467" y="569" font-size="11" fill="#1e293b">inicia_en : DATETIME / vence_en : DATETIME</text>
  <text x="467" y="586" font-size="11" fill="#1e293b">tolerancia_minutos : INT / activa : TINYINT(1)</text>

  <!-- 9. registro_asistencia -->
  <rect x="455" y="725" width="420" height="205" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="455" y="725" width="420" height="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="665" y="744" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">registro_asistencia</text>
  <text x="467" y="772" font-size="11" fill="#1e293b">PK id_registro : BIGINT</text>
  <text x="467" y="789" font-size="11" fill="#5b21b6">FK id_aprendiz : INT / FK id_sesion : INT (UK compuesta)</text>
  <text x="467" y="806" font-size="11" fill="#1e293b">fecha_hora : DATETIME / canal_registro : VARCHAR(20) / tarde_minutos : INT</text>
  <text x="467" y="823" font-size="11" fill="#1e293b">latitud : DECIMAL(10,7) / longitud : DECIMAL(10,7)</text>
  <text x="467" y="840" font-size="11" fill="#1e293b">precision_gps : DECIMAL(8,2) / verificado_gps : TINYINT(1)</text>
  <text x="467" y="857" font-size="11" fill="#1e293b">consentimiento_datos : TINYINT(1) / ip_origen : VARCHAR(45)</text>
  <text x="467" y="874" font-size="11" fill="#1e293b">estado_red : VARCHAR(20) / detalle_red : VARCHAR(255)</text>

  <!-- 10. novedad_contingencia -->
  <rect x="1030" y="755" width="405" height="145" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="1030" y="755" width="405" height="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1232" y="774" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">novedad_contingencia</text>
  <text x="1042" y="804" font-size="11" fill="#991b1b">PK,FK id_registro : BIGINT (ON DELETE CASCADE)</text>
  <text x="1042" y="822" font-size="11" fill="#1e293b">PK numero_novedad : INT</text>
  <text x="1042" y="840" font-size="11" fill="#1e293b">tipo_novedad : VARCHAR(40) / observacion : VARCHAR(255)</text>
  <text x="1042" y="858" font-size="11" fill="#1e293b">fecha_reporte : DATETIME</text>

  <!-- Relaciones FK Pata de Gallo -->
  <polyline points="320,130 390,130 390,190 455,190" fill="none" stroke="#334155" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
  <polyline points="320,300 390,300 390,235 455,235" fill="none" stroke="#334155" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
  <polyline points="750,210 925,210 925,295" fill="none" stroke="#334155" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfOneMany)"/>
  <polyline points="1135,235 1135,295" fill="none" stroke="#334155" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
  <polyline points="500,285 500,400 205,400 205,455" fill="none" stroke="#334155" stroke-width="1.6" marker-start="url(#cfZeroOne)" marker-end="url(#cfZeroMany)"/>
  <line x1="205" y1="605" x2="205" y2="680" stroke="#15803d" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
  <line x1="602" y1="285" x2="602" y2="470" stroke="#334155" stroke-width="1.6" marker-start="url(#cfZeroOne)" marker-end="url(#cfZeroMany)"/>
  <polyline points="1310,235 1310,545 860,545" fill="none" stroke="#334155" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
  <polyline points="375,565 415,565 415,825 455,825" fill="none" stroke="#334155" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
  <line x1="657" y1="625" x2="657" y2="725" stroke="#334155" stroke-width="1.6" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
  <line x1="875" y1="825" x2="1030" y2="825" stroke="#991b1b" stroke-width="1.8" marker-start="url(#cfMandOne)" marker-end="url(#cfZeroMany)"/>
</svg>
