<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1054" width="1320" height="1054" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1320" height="1054" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#0f172a">Diagrama de Actividades UML — CU-04: Registrar Asistencia por QR o Código (Móvil)</text>

  <!-- Calles / Swimlanes -->
  <rect x="25" y="50" width="380" height="922" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="405" y="50" width="610" height="922" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <rect x="1015" y="50" width="280" height="922" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="25" y="50" width="380" height="36" fill="#1e293b"/>
  <rect x="405" y="50" width="610" height="36" fill="#0f172a"/>
  <rect x="1015" y="50" width="280" height="36" fill="#1e293b"/>
  <text x="215" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Aprendiz</text>
  <text x="710" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Sistema de Asistencia</text>
  <text x="1155" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Servicio GPS</text>

  <!-- Inicio y selección de canal -->
  <circle cx="215" cy="115" r="11" fill="#0f172a"/>
  
    <path d="M215,126 L215,152" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <g>
      <polygon points="215,152 300,184 215,216 130,184" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="215" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">¿Canal de acceso?</text>
      
    </g>
  
    <path d="M130,184 L105,184 L105,235" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="61" y="205" width="94" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="108" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">[QR dinámico]</text>
  
    <path d="M300,184 L320,184 L320,235" fill="none" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="244.5" y="205" width="155" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="322" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">[Código 6 dígitos (1a)]</text>
  
    <g>
      <rect x="35" y="235" width="160" height="44" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.7"/>
      <text x="115" y="253" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Escanear QR dinámico</text>
      <text x="115" y="269" text-anchor="middle" font-size="11.5" fill="#1e293b">proyectado</text>
    </g>
  
    <g>
      <rect x="230" y="235" width="165" height="44" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.7"/>
      <text x="312.5" y="253" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Ingresar código de</text>
      <text x="312.5" y="269" text-anchor="middle" font-size="11.5" fill="#1e293b">6 dígitos en acceso</text>
    </g>

  <!-- Validación de sesión/QR -->
  
    <path d="M115,279 L115,310 L435,310" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <path d="M312,279 L312,310 L435,310" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <g>
      <polygon points="530,276 625,310 530,344 435,310" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="530" y="307" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">¿Sesión activa y</text>
      <text x="530" y="321" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">QR/código vigente?</text>
    </g>
  
    <path d="M625,310 L785,310" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="640" y="285" width="130" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="705" y="297" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">[No · vencido (2a)]</text>
  
    <g>
      <rect x="785" y="286" width="210" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/>
      <text x="890" y="306" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Mostrar aviso de QR o</text>
      <text x="890" y="322" text-anchor="middle" font-size="11.5" fill="#1e293b">sesión vencida/cerrada</text>
    </g>
  
    <path d="M965,334 L965,352" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <circle cx="965" cy="366" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="965" cy="366" r="8" fill="#0f172a"/>

  <!-- Formulario documento y consentimiento -->
  
    <path d="M530,344 L530,375" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="528" y="351" width="44" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="550" y="363" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">[Sí]</text>
  
    <g>
      <rect x="430" y="375" width="200" height="46" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.7"/>
      <text x="530" y="394" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Mostrar ficha y formulario</text>
      <text x="530" y="410" text-anchor="middle" font-size="11.5" fill="#1e293b">de documento y política</text>
    </g>
  
    <path d="M430,398 L215,398 L215,435" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <g>
      <rect x="65" y="435" width="300" height="48" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.7"/>
      <text x="215" y="455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Ingresar documento, marcar aceptación</text>
      <text x="215" y="471" text-anchor="middle" font-size="11.5" fill="#1e293b">de tratamiento de datos y enviar</text>
    </g>
  
    <path d="M365,459 L435,459" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    

  <!-- Validación consentimiento -->
  
    <g>
      <polygon points="530,425 625,459 530,493 435,459" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="530" y="456" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">¿Aceptó política de</text>
      <text x="530" y="470" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">datos (Ley 1581)?</text>
    </g>
  
    <path d="M625,459 L785,459" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="670.5" y="436" width="69" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="705" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">[No (4a)]</text>
  
    <g>
      <rect x="785" y="435" width="210" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/>
      <text x="890" y="455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Bloquear envío y exigir</text>
      <text x="890" y="471" text-anchor="middle" font-size="11.5" fill="#1e293b">aceptación de datos</text>
    </g>
  
    <path d="M965,483 L965,508" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <circle cx="965" cy="522" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="965" cy="522" r="8" fill="#0f172a"/>

  <!-- Solicitud a GPS -->
  
    <path d="M530,493 L530,540 L1050,540" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="578" y="517" width="44" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="600" y="529" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">[Sí]</text>
  
    <g>
      <rect x="1050" y="516" width="215" height="48" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.7"/>
      <text x="1157.5" y="536" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Obtener coordenadas y</text>
      <text x="1157.5" y="552" text-anchor="middle" font-size="11.5" fill="#1e293b">precisión métrica actual</text>
    </g>
  
    <path d="M1050,548 L625,582" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    

  <!-- Validación GPS y geocerca -->
  
    <g>
      <polygon points="530,546 625,582 530,618 435,582" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="530" y="579" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">¿Permiso GPS, err ≤ 100m</text>
      <text x="530" y="593" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">y dentro de sede?</text>
    </g>
  
    <path d="M625,582 L785,582" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="655" y="589" width="100" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="705" y="601" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">[No (5a / 5b)]</text>
  
    <g>
      <rect x="785" y="558" width="210" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/>
      <text x="890" y="578" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Rechazar por GPS, baja</text>
      <text x="890" y="594" text-anchor="middle" font-size="11.5" fill="#1e293b">precisión o geocerca</text>
    </g>
  
    <path d="M965,606 L965,632" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <circle cx="965" cy="646" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="965" cy="646" r="8" fill="#0f172a"/>

  <!-- Validación aprendiz, ficha y duplicado -->
  
    <path d="M530,618 L530,660" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="528" y="631" width="44" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="550" y="643" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">[Sí]</text>
  
    <g>
      <polygon points="530,660 625,696 530,732 435,696" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="530" y="693" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">¿Aprendiz activo, ficha</text>
      <text x="530" y="707" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">correcta y sin duplicado?</text>
    </g>
  
    <path d="M625,696 L785,696" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="655" y="673" width="100" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="705" y="685" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">[No (6a / 6b)]</text>
  
    <g>
      <rect x="785" y="672" width="210" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/>
      <text x="890" y="692" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Informar error de ficha,</text>
      <text x="890" y="708" text-anchor="middle" font-size="11.5" fill="#1e293b">cédula o registro previo</text>
    </g>
  
    <path d="M965,720 L965,744" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <circle cx="965" cy="758" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="965" cy="758" r="8" fill="#0f172a"/>

  <!-- Evaluación tardanza -->
  
    <path d="M530,732 L530,778" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="528" y="746" width="44" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="550" y="758" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">[Sí]</text>
  
    <g>
      <polygon points="530,778 625,814 530,850 435,814" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="530" y="811" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">¿Hora actual &gt; inicio</text>
      <text x="530" y="825" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">+ tolerancia?</text>
    </g>
  
    <path d="M530,850 L530,884" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="477" y="857" width="106" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="530" y="869" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">[No · a tiempo]</text>
  
    <path d="M625,814 L822,814 L822,884" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="676" y="791" width="118" height="17" rx="3" fill="#ffffff" fill-opacity="0.94"/><text x="735" y="803" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">[Sí (7a · CU-09)]</text>
  
    <g>
      <rect x="430" y="884" width="200" height="46" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.7"/>
      <text x="530" y="903" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Guardar asistencia</text>
      <text x="530" y="919" text-anchor="middle" font-size="11.5" fill="#1e293b">con estado A tiempo</text>
    </g>
  
    <g>
      <rect x="710" y="884" width="225" height="46" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.7"/>
      <text x="822.5" y="903" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Calcular minutos tarde</text>
      <text x="822.5" y="919" text-anchor="middle" font-size="11.5" fill="#1e293b">y guardar con tardanza</text>
    </g>

  <!-- Confirmación final -->
  
    <path d="M430,907 L335,907" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <path d="M822,930 L822,952 L215,952 L215,934" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <g>
      <rect x="95" y="888" width="240" height="46" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.7"/>
      <text x="215" y="907" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Visualizar comprobante</text>
      <text x="215" y="923" text-anchor="middle" font-size="11.5" fill="#1e293b">de asistencia confirmada</text>
    </g>
  
    <path d="M95,911 L62,911" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    
  
    <circle cx="48" cy="911" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="48" cy="911" r="8" fill="#0f172a"/>

  <!-- Nota de no concurrencia -->
  <rect x="25" y="986" width="1270" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="42" y="1008" font-size="11.5" fill="#1e293b"><tspan font-weight="700">Nota sobre concurrencia:</tspan> Este flujo modela el autorregistro individual de un aprendiz; sus pasos son estrictamente secuenciales y por tanto no requiere barras de bifurcación/unión</text>
  <text x="42" y="1027" font-size="11.5" fill="#1e293b">(fork/join), las cuales sí se modelan en el Diagrama 2 (ciclo concurrente de sesión) para representar los canales simultáneos mientras la ventana de asistencia permanece abierta.</text>
</svg>